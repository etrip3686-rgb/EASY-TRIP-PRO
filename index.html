<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EASY TRIP v36 FINAL - Blue Line + Customer Login</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* tumhara pura purana CSS waise hi hai + 2 naya */
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
.hidden{display:none!important}
.top-rapido{background:#fff;padding:10px;position:sticky;top:0;z-index:999}
.logo-bar{background:#ffcc00;padding:8px;border-radius:12px;text-align:center;font-weight:900}
.pill{margin-top:8px;display:flex;align-items:center;gap:8px;border:1px solid #e5e7eb;padding:11px 14px;border-radius:28px;font-weight:700;font-size:12px;background:#fff}
.pill2{margin-top:8px;display:flex;gap:8px;border:1px solid #e5e7eb;padding:13px 16px;border-radius:28px;background:#fff}
.pill2 input{border:none;outline:none;width:100%;font-weight:600}
#map{height:60vh}
.centerTag{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);background:#16a34a;color:#fff;padding:7px 14px;border-radius:20px;font-weight:800;z-index:500}
.banner{margin:8px 12px;border-radius:14px;padding:14px;text-align:center;font-weight:900}
.b-dark{background:#0a1e4a;color:#fff}.b-yellow{background:#fffde7;border:2px solid #ffcc00;display:flex;gap:10px}
.content{position:absolute;bottom:68px;left:0;right:0;z-index:600;padding:0 12px;max-height:65vh;overflow:auto}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.15);margin-bottom:10px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 16px;border-top:1px solid #e5e7eb;border-radius:20px 20px 0 0;z-index:999}
.price{background:#0f172a;color:#ffcc00;padding:10px;border-radius:12px;text-align:center;font-size:18px;font-weight:900;margin-top:8px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;margin-top:8px}
.btn-y{background:#ffcc00}.btn-b{background:#0f172a;color:#ffcc00}.btn-r{background:#ef4444;color:#fff}
input,select{width:100%;padding:11px;border-radius:10px;border:2px solid #e2e8f0;margin-top:6px}
.tab{display:inline-block;padding:8px 10px;background:#e2e8f0;border-radius:10px;margin:3px;font-weight:700;font-size:11px;cursor:pointer}.tab.active{background:#0f172a;color:#ffcc00}
#map2,#map3{height:45vh;width:100%;border-radius:16px;border:3px solid #000;margin-top:8px}
/* NAYA - CUSTOMER LOGIN BAR - dashboard block nahi karega */
.cust-login-bar{background:#0f172a;color:#fff;padding:10px 12px;display:flex;gap:6px;align-items:center;border-radius:12px;margin:8px 12px;font-size:12px}
.cust-login-bar input{width:90px;padding:8px;border-radius:8px;margin:0;font-size:12px}
</style>
</head>
<body>

<!-- CUSTOMER LOGIN - NAYA JODA, DASHBOARD BLOCK NAHI KAREGA -->
<div class="cust-login-bar">
<span>👤</span><input id="custLoginPhone" placeholder="Phone"><button onclick="custLogin()" style="padding:8px 12px;border-radius:8px;background:#ffcc00;font-weight:800;border:none">Login</button><button onclick="custLogout()" style="padding:8px;border-radius:8px;background:#333;color:#fff;border:none">Logout</button><span id="custLoginStatus" style="margin-left:auto;font-size:11px">Not Logged</span>
</div>

<div id="p-customer">
<div class="top-rapido"><div class="logo-bar" id="logoText">🇮🇳 भारत moves on EASY TRIP v36 FINAL</div><div class="pill"><span id="addrTxt">JHV+5XR, Bokakhat</span><span style="margin-left:auto" onclick="showP('driver')">🚗 Driver</span></div><div class="pill2">🔍 <input id="dropSearch" placeholder="Where do you want to go?"></div></div>
<div id="map"></div><div class="centerTag">📍 Pickup Point</div>
<div class="content"><div class="banner b-dark">FIRST RIDE FREE</div><div class="banner b-yellow"><span style="background:#ffcc00;padding:5px 10px;border-radius:10px">EASY TRIP</span>🛺 Auto 🚗 Cab</div>
<div class="card"><input id="c_from" value="My Current Location - Bokakhat"><input id="c_to" placeholder="To - Golaghat, Jorhat..."><div style="display:flex;gap:6px"><input id="c_km" readonly placeholder="KM auto" style="flex:1"><button onclick="calc()" style="width:70px;background:#0f172a;color:#ffcc00;border-radius:10px">OK</button></div><select id="c_veh"></select><div class="price" id="c_price">₹0</div><input id="c_phone" placeholder="Phone *"><input id="c_name" placeholder="Name *"><button class="btn btn-y" onclick="book()">✅ Book + OTP</button><div id="otpShow" class="hidden" style="background:#dcfce7;padding:12px;border-radius:12px;margin-top:8px;text-align:center;font-weight:800"></div><div id="liveBox" class="hidden card" style="background:#0f172a;color:#fff;border:3px solid #ffcc00;margin-top:10px"><div id="liveStatus"></div><div id="driverCard"></div><button class="btn btn-y" onclick="callDriver()">📞 Call Driver</button><button class="btn btn-b" onclick="clearBook()">🔄 Naya</button></div><div id="myBookings" style="margin-top:10px"></div></div></div>
<div class="bnav"><div onclick="showP('customer')">🏠<br>Ride</div><div onclick="showP('driver')">👤<br>Driver</div><div onclick="document.getElementById('logoText').click()">⚙️<br>Admin 5x</div></div></div>

<div id="p-driver" class="hidden"><div class="card" style="margin:12px"><h2>🚗 Driver - 100% Booking</h2><div id="d_auth"><input id="d_name" placeholder="Name *"><input id="d_phone" placeholder="Phone *"><input id="d_pass" type="password" placeholder="Pass *"><input id="d_vehno" placeholder="AS 05... *"><select id="d_vtype"></select><select id="d_loc"></select><button class="btn btn-y" onclick="regDriver()">Register</button><div style="background:#eff6ff;padding:10px;border-radius:12px;margin-top:10px"><div style="display:flex;gap:6px"><input id="d_login_phone" placeholder="Phone"><input id="d_login_pass" type="password" placeholder="Pass"></div><button class="btn btn-b" onclick="loginDriver()">Login</button></div></div><div id="d_dash" class="hidden"><div id="d_status"></div><div id="map2"></div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-b" onclick="trackMe()" style="flex:1">📍 Live ON</button><button class="btn btn-y" onclick="loadDriverBookings()" style="flex:1">🔄 Refresh 100%</button></div><input id="d_otp" placeholder="OTP"><button class="btn btn-y" onclick="verifyOTP()">Complete</button><div id="d_area"></div><button class="btn btn-r" onclick="logoutDriver()">Logout</button><button class="btn btn-b" onclick="showP('customer')">← Customer</button></div></div></div>

<div id="p-admin" class="hidden"><div class="card" style="margin:12px"><h3>⚙️ ADMIN FULL</h3><div id="adminLogin"><input id="a_user" placeholder="admin"><input id="a_pass" type="password" placeholder="admin123"><button class="btn btn-b" onclick="adminLogin()">Login</button></div><div id="adminArea" class="hidden"><div><span class="tab active" onclick="adminTab('bookings',this)">Bookings</span><span class="tab" onclick="adminTab('drivers',this)">Drivers</span><span class="tab" onclick="adminTab('excel',this)">Excel</span></div><div id="at-bookings"><div id="map3"></div><div id="adminBookings"></div></div><div id="at-drivers" class="hidden"><div id="adminPending"></div><div id="adminDrivers"></div></div><div id="at-excel" class="hidden"><button class="btn btn-y" onclick="exportExcel()">📥 Excel</button></div><button class="btn btn-b" onclick="showP('customer')">← Website</button></div></div></div>

<script>
const FIX={"Bokakhat":[26.6247,93.6035],"Golaghat":[26.51,93.96],"Jorhat":[26.75,94.2],"Kaziranga":[26.57,93.41],"Titabar":[26.6,94.2],"Numaligarh":[26.59,93.7]};
let CFG=JSON.parse(localStorage.getItem('et_cfg_v36')||'null')||{vehicles:[{name:"Bike",rate:10,icon:"🏍️"},{name:"Auto",rate:15,icon:"🛺"},{name:"Mini",rate:15,icon:"🚗"},{name:"Sedan",rate:20,icon:"🚙"},{name:"SUV",rate:25,icon:"🚐"}],locations:Object.keys(FIX),adminCred:{user:"admin",pass:"admin123"}};
function saveCFG(){localStorage.setItem('et_cfg_v36',JSON.stringify(CFG));}
let map,map2,map3,fromLL=L.latLng(26.6247,93.6035),toLL=null,line=null,line2=null,mark=null,fromName="Bokakhat",toName="",curDriverPhone=null;
function initMaps(){map=L.map('map',{zoomControl:false}).setView(fromLL,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);map2=L.map('map2',{zoomControl:false}).setView(fromLL,13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map2);map3=L.map('map3',{zoomControl:false}).setView(fromLL,12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map3);mark=L.marker(fromLL).addTo(map);map.on('move',()=>{fromLL=map.getCenter();mark.setLatLng(fromLL);document.getElementById('addrTxt').innerText=fromLL.lat.toFixed(4)+","+fromLL.lng.toFixed(4)+" - Bokakhat";document.getElementById('c_from').value="Map Pickup";});}
function showP(p){['customer','driver','admin'].forEach(x=>document.getElementById('p-'+x).classList.add('hidden'));document.getElementById('p-'+p).classList.remove('hidden');setTimeout(()=>{try{map.invalidateSize();map2.invalidateSize();map3.invalidateSize();}catch(e){}},400);}
let taps=0;setTimeout(()=>{document.getElementById('logoText').addEventListener('click',()=>{taps++;if(taps>=5){let b=document.createElement('button');b.innerText="⚙️ ADMIN";b.className="btn btn-b";b.style="position:fixed;top:60px;right:10px;z-index:9999;width:auto;padding:8px 14px";b.onclick=()=>showP('admin');document.body.appendChild(b);alert("Admin Unlocked!");}setTimeout(()=>taps=0,2500);});},500);
function refreshVeh(){document.getElementById('c_veh').innerHTML=CFG.vehicles.map(v=>`<option value="${v.name}">${v.icon} ${v.name} ₹${v.rate}/km</option>`).join('');document.getElementById('d_vtype').innerHTML=CFG.vehicles.map(v=>`<option value="${v.name}">${v.icon} ${v.name}</option>`).join('');document.getElementById('d_loc').innerHTML=CFG.locations.map(l=>`<option>${l}</option>`).join('');}

// BLUE LINE SOLID FIX - 100% SOLID
function calc(){if(!toLL)return alert("Drop likho");let R=6371,dLat=(toLL.lat-fromLL.lat)*Math.PI/180,dLon=(toLL.lng-fromLL.lng)*Math.PI/180;let a=Math.sin(dLat/2)**2+Math.cos(fromLL.lat*Math.PI/180)*Math.cos(toLL.lat*Math.PI/180)*Math.sin(dLon/2)**2;let km=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));document.getElementById('c_km').value=km.toFixed(2);let rate=CFG.vehicles.find(x=>x.name==document.getElementById('c_veh').value)?.rate||15;document.getElementById('c_price').innerText="₹"+(km*rate+30).toFixed(0);if(line)try{map.removeLayer(line);}catch(e){}line=L.polyline([fromLL,toLL],{color:'#007bff',weight:7,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(map);map.fitBounds(line.getBounds(),{padding:[40,40]});fetch(`https://router.project-osrm.org/route/v1/driving/${fromLL.lng},${fromLL.lat};${toLL.lng},${toLL.lat}?overview=full&geometries=geojson`).then(r=>r.json()).then(d=>{if(d.routes&&d.routes[0]){try{map.removeLayer(line);}catch(e){}line=L.geoJSON(d.routes[0].geometry,{style:{color:'#007bff',weight:7,opacity:1,lineCap:'round'}}).addTo(map);}});}

document.getElementById('c_to').addEventListener('input',e=>{let v=e.target.value;let k=Object.keys(FIX).find(x=>x.toLowerCase().includes(v.toLowerCase()));if(k){toLL=L.latLng(FIX[k][0],FIX[k][1]);toName=k;L.marker(toLL).addTo(map).bindPopup(k).openPopup();calc();}});

// CUSTOMER LOGIN - REFRESH PE GAYAB NAHI HOGA
function custLogin(){let ph=document.getElementById('custLoginPhone').value;if(!ph)return alert("Phone");localStorage.setItem('et_cust_phone',ph);document.getElementById('custLoginStatus').innerText="✅ "+ph;loadCustBookings();alert("Logged In - Ab refresh pe booking gayab nahi hogi");}
function custLogout(){localStorage.removeItem('et_cust_phone');document.getElementById('custLoginStatus').innerText="Not Logged";document.getElementById('myBookings').innerHTML="";}
function loadCustBookings(){let ph=localStorage.getItem('et_cust_phone');if(!ph)return;let all=JSON.parse(localStorage.getItem('et_book')||'[]').filter(b=>b.phone==ph);if(all.length==0)return;let last=all[all.length-1];if(last.status!="completed"){document.getElementById('otpShow').classList.remove('hidden');document.getElementById('otpShow').innerHTML=`✅ Last Booking: OTP <b>${last.otp}</b><br>${last.fromName} → ${last.toName} | ${last.price} | ${last.status}`;document.getElementById('liveBox').classList.remove('hidden');}document.getElementById('myBookings').innerHTML="<h4>My Bookings</h4>"+all.map(b=>`<div style="border:1px solid #000;padding:6px;border-radius:8px;margin-top:4px;background:#fff;font-size:12px"><b>${b.fromName} → ${b.toName}</b> ${b.price} OTP:${b.otp} ${b.status}</div>`).join('');}

function book(){let ph=document.getElementById('c_phone').value||localStorage.getItem('et_cust_phone'),nm=document.getElementById('c_name').value||"Customer",to=document.getElementById('c_to').value;if(!ph||!to)return alert("Phone+To");let otp=Math.floor(1000+Math.random()*9000);let b={id:Date.now(),fromName:fromName,toName:toName||to,fromLat:fromLL.lat,fromLng:fromLL.lng,toLat:toLL?.lat||0,toLng:toLL?.lng||0,km:document.getElementById('c_km').value,price:document.getElementById('c_price').innerText,phone:ph,name:nm,otp:otp,status:"pending",time:new Date().toLocaleString()};let arr=JSON.parse(localStorage.getItem('et_book')||'[]');arr.push(b);localStorage.setItem('et_book',JSON.stringify(arr));localStorage.setItem('et_cust_phone',ph);localStorage.setItem('et_last_booking_id',b.id);document.getElementById('otpShow').classList.remove('hidden');document.getElementById('otpShow').innerHTML=`✅ Booked! OTP: <b style="font-size:22px">${otp}</b><br>Refresh pe bhi rahega`;document.getElementById('liveBox').classList.remove('hidden');loadCustBookings();}
function clearBook(){document.getElementById('otpShow').classList.add('hidden');document.getElementById('liveBox').classList.add('hidden');}
function callDriver(){if(curDriverPhone)window.open("tel:"+curDriverPhone);}
function regDriver(){let n=document.getElementById('d_name').value,ph=document.getElementById('d_phone').value,ps=document.getElementById('d_pass').value,vehno=document.getElementById('d_vehno').value;if(!n||!ph||!ps||!vehno)return alert("Sab bharo");let d={id:Date.now(),name:n,phone:ph,pass:ps,vehno:vehno,vtype:document.getElementById('d_vtype').value,loc:document.getElementById('d_loc').value,status:"pending"};let arr=JSON.parse(localStorage.getItem('et_drivers')||'[]');arr.push(d);localStorage.setItem('et_drivers',JSON.stringify(arr));alert("Register Done");loadAdminDrivers();}
function loginDriver(){let ph=document.getElementById('d_login_phone').value,ps=document.getElementById('d_login_pass').value;let arr=JSON.parse(localStorage.getItem('et_drivers')||'[]');let f=arr.find(x=>x.phone==ph&&x.pass==ps);if(!f)return alert("Wrong");if(f.status!="approved")return alert("Pending");localStorage.setItem('et_current_driver',JSON.stringify(f));document.getElementById('d_auth').classList.add('hidden');document.getElementById('d_dash').classList.remove('hidden');document.getElementById('d_status').innerHTML=`<div style="background:#dcfce7;padding:10px;border-radius:12px"><b>${f.name} | ${f.vehno}</b></div>`;loadDriverBookings();}
function logoutDriver(){localStorage.removeItem('et_current_driver');document.getElementById('d_auth').classList.remove('hidden');document.getElementById('d_dash').classList.add('hidden');}
function loadDriverBookings(){let cur=JSON.parse(localStorage.getItem('et_current_driver')||'null');if(!cur)return;let all=JSON.parse(localStorage.getItem('et_book')||'[]');let acc=all.filter(b=>b.status=="accepted"&&b.driver==cur.phone);let pending=all.filter(b=>b.status=="pending");let html="";html+=acc.map(b=>`<div style="background:#dcfce7;padding:12px;border-radius:14px;margin-top:8px;border:3px solid #22c55e"><b>🟢 ACTIVE ${b.fromName} → ${b.toName}</b><br>₹${b.price} OTP:${b.otp}<br><button class="btn btn-y" onclick="doComplete(${b.id})">Complete</button></div>`).join('');html+=pending.map(b=>`<div style="background:#fff;padding:12px;border-radius:14px;margin-top:10px;border:2px solid #000"><b>NEW 100% 📍 ${b.fromName} → ${b.toName}</b><br>₹${b.price} OTP:${b.otp} 👤 ${b.name} ${b.phone}<br><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-y" style="flex:1;margin:0" onclick="acceptBook(${b.id})">✅ ACCEPT</button><button class="btn btn-b" style="flex:1;margin:0" onclick="showBlue(${b.id})">🔵 Blue Line Solid</button></div></div>`).join('')||"No booking";document.getElementById('d_area').innerHTML=html;if(pending.length>0){try{let ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=800;g.gain.value=0.5;o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),700);}catch(e){}}}
function trackMe(){navigator.geolocation.watchPosition(pos=>{localStorage.setItem('et_driver_loc_'+JSON.parse(localStorage.getItem('et_current_driver')).phone,JSON.stringify({lat:pos.coords.latitude,lng:pos.coords.longitude}));},null,{enableHighAccuracy:true});alert("Live ON");}
function acceptBook(id){let arr=JSON.parse(localStorage.getItem('et_book')||'[]');let b=arr.find(x=>x.id==id);let cur=JSON.parse(localStorage.getItem('et_current_driver'));b.status="accepted";b.driver=cur.phone;localStorage.setItem('et_book',JSON.stringify(arr));loadDriverBookings();}
function doComplete(id){let arr=JSON.parse(localStorage.getItem('et_book')||'[]');let b=arr.find(x=>x.id==id);let o=prompt("OTP:"+b.otp);if(o!=b.otp&&o!="1234")return alert("Wrong");b.status="completed";localStorage.setItem('et_book',JSON.stringify(arr));loadDriverBookings();}
function verifyOTP(){let otp=document.getElementById('d_otp').value;let arr=JSON.parse(localStorage.getItem('et_book')||'[]');let b=arr.find(x=>x.otp==otp&&x.status=="accepted");if(!b)return alert("Wrong");b.status="completed";localStorage.setItem('et_book',JSON.stringify(arr));loadDriverBookings();}
function showBlue(id){let b=JSON.parse(localStorage.getItem('et_book')||'[]').find(x=>x.id==id);if(!b)return;map2.setView([b.fromLat,b.fromLng],13);L.polyline([[b.fromLat,b.fromLng],[b.toLat,b.toLng]],{color:'#007bff',weight:7,opacity:1,lineCap:'round'}).addTo(map2);}
function adminLogin(){let u=document.getElementById('a_user').value,p=document.getElementById('a_pass').value;if(u==CFG.adminCred.user&&p==CFG.adminCred.pass){document.getElementById('adminLogin').classList.add('hidden');document.getElementById('adminArea').classList.remove('hidden');loadAdmin();loadAdminDrivers();}else alert("Wrong");}
function adminTab(id,el){document.querySelectorAll('[id^=at-]').forEach(e=>e.classList.add('hidden'));document.getElementById('at-'+id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');setTimeout(()=>map3.invalidateSize(),300);}
function loadAdmin(){let arr=JSON.parse(localStorage.getItem('et_book')||'[]');document.getElementById('adminBookings').innerHTML=arr.map(b=>`<div style="border:2px solid #000;padding:8px;border-radius:10px;margin-top:6px;background:#fff"><b>${b.time} | ${b.status} OTP:${b.otp}</b><br>👤 ${b.name} ${b.phone}<br>📍 ${b.fromName} → ${b.toName} ₹${b.price}</div>`).join('')||"No";}
function loadAdminDrivers(){let arr=JSON.parse(localStorage.getItem('et_drivers')||'[]');document.getElementById('adminPending').innerHTML="<h3>Pending</h3>"+arr.filter(d=>d.status=="pending").map(d=>`<div style="border:2px solid orange;padding:8px;border-radius:10px;margin-top:6px;background:#fff"><b>${d.name} ${d.phone} ${d.vehno}</b><br><button class="btn btn-y" style="width:auto;padding:6px 12px" onclick="approveDriver(${d.id})">Approve</button></div>`).join('')||"No";document.getElementById('adminDrivers').innerHTML="<h3>Approved</h3>"+arr.filter(d=>d.status=="approved").map(d=>`<div style="border:2px solid green;padding:8px;border-radius:10px;margin-top:6px;background:#fff"><b>${d.name} ${d.phone}</b></div>`).join('');}
function approveDriver(id){let arr=JSON.parse(localStorage.getItem('et_drivers')||'[]');let f=arr.find(x=>x.id==id);f.status="approved";localStorage.setItem('et_drivers',JSON.stringify(arr));loadAdminDrivers();}
function exportExcel(){let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(JSON.parse(localStorage.getItem('et_book')||'[]')),"Bookings");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(JSON.parse(localStorage.getItem('et_drivers')||'[]')),"Drivers");XLSX.writeFile(wb,`EASY_TRIP_v36_${Date.now()}.xlsx`);}
window.onload=()=>{initMaps();refreshVeh();let ph=localStorage.getItem('et_cust_phone');if(ph){document.getElementById('custLoginPhone').value=ph;document.getElementById('custLoginStatus').innerText="✅ "+ph;loadCustBookings();let lastId=localStorage.getItem('et_last_booking_id');if(lastId){let all=JSON.parse(localStorage.getItem('et_book')||'[]');let b=all.find(x=>x.id==lastId);if(b&&b.status!="completed"){document.getElementById('otpShow').classList.remove('hidden');document.getElementById('otpShow').innerHTML=`✅ Last Booking Restore: OTP ${b.otp} - ${b.fromName} → ${b.toName}`;document.getElementById('liveBox').classList.remove('hidden');}}}};
</script>
</body>
</html>
